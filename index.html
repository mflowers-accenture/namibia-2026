 · 07:00 departure.`],[`A full day in an open safari jeep, with exposed morning air and sun later. You change camps, so pack your main bag before leaving.`,`Start in long pants, T-shirt, fleece/hoodie and windproof jacket; remove layers as needed. Closed shoes, buff, hat, sunscreen, water and camera.`,`05:30 wake · 06:00 breakfast · 06:30 bags/check-out · 06:50 ready · 07:00 departure.`],[`Road travel and outdoor walking at the Petrified Forest and Twyfelfontein, followed by a tent night at Madisa. Arrange your packed lunch ahead.`,`Light hiking clothes, grippy trail shoes and sun hat. Keep water, sunscreen, headlamp, warm evening layer and sleep clothes accessible.`,`06:30 wake · 07:00 breakfast · 07:30 bags/check-out · 07:50 ready · 08:00 departure.`],[`A travel day from inland stops to the exposed coast, Cape Cross and Swakopmund. Laundry on arrival; Spitzkoppe is unconfirmed, not part of the base plan.`,`Light layers plus long pants, fleece and windproof jacket for the coast. Closed shoes, water, packed lunch and laundry bag.`,`05:30 wake · 06:00 breakfast · 06:30 bags/check-out · 06:50 ready · 07:00 departure.`],[`Four hours on a catamaran with lunch, then a 4×4 outing at Sandwich Harbour. Prepare for wind, spray and sand; second night at the same lodge.`,`Long pants, T-shirt, fleece and windproof/splash-resistant jacket. Secure closed shoes and hat; protect phone/camera from spray and sand.`,`06:30 wake · 07:00 breakfast · 07:30 day bag · 07:50 ready · 08:00 departure.`],[`Free time in Swakopmund before a roughly five-hour drive into the desert. Collect laundry and packed lunch before departure; first of two tent nights.`,`Layers for the coastal morning, breathable clothes for the drive and trail shoes for any camp walk. Pack a two-night camp pouch and headlamp.`,`08:00 wake · 08:30 breakfast · 09:00 laundry/packed lunch · 09:30 bags/check-out · 09:50 ready · 10:00 departure. Wake earlier if you want more free time.`],[`An early Dune 45 outing, then Deadvlei/Sossusvlei, the strenuous Big Daddy dune climb and Sesriem Canyon. Expect sand, walking and strong sun; same camp tonight.`,`Trail shoes with socks, light hiking clothes, hat and warm dawn layers. Headlamp, sunscreen and plenty of water. Keep sand out of shoes and protect electronics.`,`04:30 suggested wake to dress and prepare before the itinerary’s 05:00 wake-up/early-start window. Exact Dune 45 departure and breakfast timing need confirmation. Arrange a breakfast pack if service is too late; allow a meal break before the 08:00 desert excursion if the coordinator confirms it.`],[`About five hours driving to Windhoek, then check-in. The optional 15:00 township tour lasts three hours, followed by the final dinner.`,`Comfortable travel clothes and walking shoes; a clean casual outfit and light evening layer for dinner. Keep tour essentials handy.`,`07:30 wake · 08:00 breakfast · 08:30 bags/check-out · 08:50 ready · 09:00 departure.`],[`Departure day, with free time only as your own flight permits. Confirm pickup, checkout and airport timing individually.`,`Comfortable travel layers and closed shoes. Documents, medications, charger and essential items in your small bag.`,`Wake 90 minutes before your confirmed pickup: 30 min getting ready, 30 min breakfast, 20 min final packing/check-out, 10 min buffer. Arrange earlier breakfast/takeaway if needed.`]]},it:{expect:`Cosa aspettarsi`,wear:`Come vestirsi e cosa tenere a portata`,morning:`Routine mattutina consigliata`,note:`Orari consigliati, non istruzioni del coordinatore. Prevedere 30 min per prepararsi, 30 min per colazione, 20 min per bagagli/check-out e 10 min di margine. Confermare il servizio colazione; chiedere una colazione da asporto la sera prima se necessario. Abbigliamento basato sulle attività: controllare il meteo sotto.`,days:[[`Arrivo e sistemazione, poi passeggiata in città e aperitivo al tramonto. Preparare uno zainetto dopo il check-in.`,`Vestiti leggeri, scarpe comode e giacca leggera per la sera. Acqua, occhiali e crema solare.`,`Flessibile secondo l’arrivo. Mangiare e rinfrescarsi prima della passeggiata; pronti alle 16:20 per le 16:30.`],[`Lungo trasferimento, visita ai ghepardi e trekking di circa un’ora al tramonto a Waterberg. Tenere fuori dal bagaglio l’occorrente per camminare.`,`Maglietta, pantaloni da trekking leggeri o shorts, scarpe da trail e cappello. Acqua e pile per dopo il tramonto.`,`05:30 sveglia · 06:00 colazione · 06:30 bagagli/check-out · 06:50 pronti · 07:00 partenza.`],[`Circa quattro ore di viaggio verso Etosha, poi safari pomeridiano di due ore nel veicolo standard. Molto tempo seduti a osservare gli animali.`,`Strati traspiranti, pantaloni comodi o shorts e scarpe chiuse. Cappello, acqua, binocolo/fotocamera e strato per la sera.`,`05:30 sveglia · 06:00 colazione · 06:30 bagagli/check-out · 06:50 pronti · 07:00 partenza.`],[`Giornata intera in jeep aperta, con aria fresca al mattino e sole più tardi. Si cambia campo: preparare tutti i bagagli prima di partire.`,`Pantaloni lunghi, maglietta, pile/felpa e antivento al mattino. Scarpe chiuse, scaldacollo, cappello, crema solare, acqua e fotocamera.`,`05:30 sveglia · 06:00 colazione · 06:30 bagagli/check-out · 06:50 pronti · 07:00 partenza.`],[`Trasferimenti e passeggiate alla Foresta Pietrificata e a Twyfelfontein, poi notte in tenda al Madisa. Organizzare il pranzo al sacco.`,`Vestiti da trekking leggeri, scarpe con buona aderenza e cappello. Acqua, crema solare, frontale, strato caldo e vestiti per dormire accessibili.`,`06:30 sveglia · 07:00 colazione · 07:30 bagagli/check-out · 07:50 pronti · 08:00 partenza.`],[`Dall’entroterra alla costa esposta, Cape Cross e Swakopmund. Bucato all’arrivo; Spitzkoppe non è confermato né parte del programma base.`,`Strati leggeri, pantaloni lunghi, pile e antivento per la costa. Scarpe chiuse, acqua, pranzo al sacco e borsa del bucato.`,`05:30 sveglia · 06:00 colazione · 06:30 bagagli/check-out · 06:50 pronti · 07:00 partenza.`],[`Quattro ore in catamarano con pranzo, poi escursione in 4×4 a Sandwich Harbour. Vento, spruzzi e sabbia; seconda notte nello stesso alloggio.`,`Pantaloni lunghi, maglietta, pile e giacca antivento resistente agli spruzzi. Scarpe chiuse e cappello ben fissato; proteggere telefono e fotocamera.`,`06:30 sveglia · 07:00 colazione · 07:30 zainetto · 07:50 pronti · 08:00 partenza.`],[`Mattina libera a Swakopmund, poi circa cinque ore verso il deserto. Ritirare bucato e pranzo prima della partenza; prima di due notti in tenda.`,`Strati per la costa, vestiti traspiranti per il viaggio e scarpe da trail per camminare al campo. Borsa per due notti e frontale.`,`08:00 sveglia · 08:30 colazione · 09:00 bucato/pranzo al sacco · 09:30 bagagli/check-out · 09:50 pronti · 10:00 partenza. Anticipare la sveglia per più tempo libero.`],[`Uscita presto a Dune 45, poi Deadvlei/Sossusvlei, salita impegnativa a Big Daddy e Sesriem Canyon. Sabbia, camminate e sole; stesso campo stanotte.`,`Scarpe da trail con calze, vestiti leggeri, cappello e strati caldi all’alba. Frontale, crema solare e molta acqua. Proteggere scarpe ed elettronica dalla sabbia.`,`04:30 sveglia consigliata per vestirsi prima della finestra di sveglia/inizio alle 05:00 nell’itinerario. Partenza per Dune 45 e colazione da confermare. Chiedere una colazione da asporto se il servizio è tardi; prevedere una pausa pasto prima dell’escursione delle 08:00 se confermata dal coordinatore.`],[`Circa cinque ore fino a Windhoek e check-in. Tour facoltativo della township alle 15:00 per tre ore, poi cena finale.`,`Vestiti comodi e scarpe per camminare; cambio casual pulito e strato leggero per la cena. Zainetto del tour pronto.`,`07:30 sveglia · 08:00 colazione · 08:30 bagagli/check-out · 08:50 pronti · 09:00 partenza.`],[`Giorno di partenza; tempo libero secondo il proprio volo. Confermare individualmente transfer, check-out e arrivo in aeroporto.`,`Strati comodi e scarpe chiuse. Documenti, farmaci, caricatore ed essenziali nello zaino piccolo.`,`Sveglia 90 minuti prima del transfer confermato: 30 min per prepararsi, 30 min colazione, 20 min bagagli/check-out, 10 min di margine. Concordare colazione anticipata o da asporto.`]]},es:{expect:`Qué esperar`,wear:`Qué ponerse y tener a mano`,morning:`Rutina matutina sugerida`,note:`Horarios sugeridos, no instrucciones del coordinador. Calcula 30 min para prepararte, 30 min para desayunar, 20 min para equipaje/salida y 10 min de margen. Confirma el servicio de desayuno; pide uno para llevar la noche anterior si hace falta. Ropa recomendada según actividades: consulta el pronóstico abajo.`,days:[[`Llegada e instalación, paseo por la ciudad y aperitivo al atardecer. Preparar una mochila pequeña tras el registro.`,`Ropa ligera, calzado cómodo y chaqueta ligera para la noche. Agua, gafas y protector solar.`,`Flexible según la llegada. Comer y refrescarse antes del paseo; estar listos a las 16:20 para las 16:30.`],[`Traslado largo, visita a los guepardos y caminata de una hora al atardecer en Waterberg. Dejar accesible el equipo de senderismo.`,`Camiseta, pantalón ligero o shorts, zapatillas de trail y sombrero. Agua y polar para después del atardecer.`,`05:30 despertar · 06:00 desayuno · 06:30 equipaje/salida del alojamiento · 06:50 listos · 07:00 salida.`],[`Unas cuatro horas hasta Etosha, después safari de dos horas por la tarde en vehículo estándar. Mucho tiempo sentados observando fauna.`,`Capas transpirables, pantalón cómodo o shorts y calzado cerrado. Sombrero, agua, prismáticos/cámara y capa para la noche.`,`05:30 despertar · 06:00 desayuno · 06:30 equipaje/salida del alojamiento · 06:50 listos · 07:00 salida.`],[`Día completo en jeep abierto, con aire fresco por la mañana y sol después. Cambio de campamento: dejar el equipaje listo antes de salir.`,`Pantalón largo, camiseta, polar/sudadera y cortavientos al empezar. Calzado cerrado, braga de cuello, sombrero, protector solar, agua y cámara.`,`05:30 despertar · 06:00 desayuno · 06:30 equipaje/salida del alojamiento · 06:50 listos · 07:00 salida.`],[`Traslados y caminatas en el Bosque Petrificado y Twyfelfontein, seguidos de noche en tienda en Madisa. Organizar almuerzo para llevar.`,`Ropa ligera de senderismo, calzado con agarre y sombrero. Agua, protector solar, frontal, capa cálida y ropa para dormir accesibles.`,`06:30 despertar · 07:00 desayuno · 07:30 equipaje/salida del alojamiento · 07:50 listos · 08:00 salida.`],[`Viaje del interior a la costa expuesta, Cape Cross y Swakopmund. Lavandería al llegar; Spitzkoppe no está confirmado ni forma parte del plan base.`,`Capas ligeras, pantalón largo, polar y cortavientos para la costa. Calzado cerrado, agua, almuerzo y bolsa de ropa para lavar.`,`05:30 despertar · 06:00 desayuno · 06:30 equipaje/salida del alojamiento · 06:50 listos · 07:00 salida.`],[`Cuatro horas en catamarán con almuerzo, después excursión en 4×4 a Sandwich Harbour. Viento, salpicaduras y arena; mismo alojamiento esta noche.`,`Pantalón largo, camiseta, polar y chaqueta cortavientos resistente a salpicaduras. Calzado cerrado y sombrero bien sujetos; proteger móvil y cámara.`,`06:30 despertar · 07:00 desayuno · 07:30 mochila · 07:50 listos · 08:00 salida.`],[`Mañana libre en Swakopmund, luego unas cinco horas al desierto. Recoger ropa y almuerzo antes de salir; primera de dos noches en tienda.`,`Capas para la costa, ropa transpirable para el viaje y zapatillas de trail para pasear por el campamento. Bolsa para dos noches y frontal.`,`08:00 despertar · 08:30 desayuno · 09:00 lavandería/almuerzo · 09:30 equipaje/salida del alojamiento · 09:50 listos · 10:00 salida. Madrugar más si quieres tiempo libre.`],[`Salida temprana a Dune 45, después Deadvlei/Sossusvlei, subida exigente a Big Daddy y Sesriem Canyon. Arena, caminatas y sol; mismo campamento esta noche.`,`Zapatillas de trail con calcetines, ropa ligera, sombrero y capas cálidas al amanecer. Frontal, protector solar y mucha agua. Proteger calzado y electrónica de la arena.`,`04:30 despertar sugerido para vestirse antes de la franja de despertar/inicio de las 05:00 del itinerario. Confirmar salida a Dune 45 y desayuno. Pedir desayuno para llevar si el servicio abre tarde; prever una pausa para comer antes de la excursión de las 08:00 si lo confirma el coordinador.`],[`Unas cinco horas hasta Windhoek y registro. Visita opcional al township a las 15:00 durante tres horas, seguida de cena final.`,`Ropa cómoda y calzado para caminar; conjunto casual limpio y capa ligera para cenar. Mochila de la visita accesible.`,`07:30 despertar · 08:00 desayuno · 08:30 equipaje/salida del alojamiento · 08:50 listos · 09:00 salida.`],[`Día de salida, con tiempo libre según tu vuelo. Confirmar individualmente recogida, salida del alojamiento y hora en el aeropuerto.`,`Capas cómodas y calzado cerrado. Documentos, medicación, cargador y esenciales en la mochila pequeña.`,`Despertar 90 minutos antes de la recogida confirmada: 30 min para prepararte, 30 min desayuno, 20 min equipaje/salida, 10 min margen. Acordar desayuno temprano o para llevar.`]]}},b={labels:{en:{title:`Namibia 2026 · Group Travel Guide`,glance:`Today at a glance`,departure:`Departure / first plan`,meeting:`Meeting point`,pending:`Awaiting coordinator confirmation`,tonight:`Tonight`,bring:`Bring today`,reminders:`Practical reminders`,changes:`Trip changes & confirmations`,changeNote:`Source: coordinator itinerary dated September 18, 2026. This notice is updated manually when confirmed changes are supplied; it is not a live feed.`,changeText:`Day 4 is the only confirmed open-jeep safari (group fund N$1,000). Cape Cross remains the Day 6 base plan; Spitzkoppe is an optional, unconfirmed Plan B. Day 8 departure is 10:00. Day 10 township tour is optional: 15:00, 3 hours, N$750 extra.`,costs:`Activity costs`,cc:`Group fund (CC)`,extra:`Optional extra (FT)`,included:`Included in excursion`,unknown:`Coverage / price to confirm`,costNote:`CC amounts are allocated from the group fund, not an additional payment on top. Do not assume unlabelled activities or meals are included. Confirm unclear costs with the coordinator.`,offline:`Download offline itinerary (PDF)`,offlineNote:`Save this PDF before losing reception. Includes the day-by-day plan and accommodation contacts; no live weather. Version: September 24, 2026.`,plan:`Open today’s plan`,early:`05:00 early start · 08:00 desert excursion`,arrival:`Check-in from 14:00 · city walk 16:30`,flex:`Flexible · arrange your airport transfer`,packed:`Packed lunch: arrange ahead; paid separately.`,source:`Planned times · confirm any changes with the coordinator.`},it:{title:`Namibia 2026 · Guida del viaggio di gruppo`,glance:`Oggi in breve`,departure:`Partenza / primo appuntamento`,meeting:`Punto di ritrovo`,pending:`In attesa di conferma del coordinatore`,tonight:`Questa notte`,bring:`Cosa portare oggi`,reminders:`Promemoria pratici`,changes:`Modifiche e conferme del viaggio`,changeNote:`Fonte: itinerario del coordinatore del 18 settembre 2026. Avviso aggiornato manualmente quando riceviamo modifiche confermate; non è un aggiornamento in tempo reale.`,changeText:`Il giorno 4 è l’unico safari confermato in jeep aperta (cassa comune N$1.000). Cape Cross resta il programma base del giorno 6; Spitzkoppe è un Piano B facoltativo e non confermato. Partenza del giorno 8 alle 10:00. Tour della township del giorno 10 facoltativo: 15:00, 3 ore, N$750 extra.`,costs:`Costi delle attività`,cc:`Cassa comune (CC)`,extra:`Extra facoltativo (FT)`,included:`Incluso nell’escursione`,unknown:`Copertura / prezzo da confermare`,costNote:`Gli importi CC sono a carico della cassa comune, non pagamenti aggiuntivi. Non presumere che attività o pasti senza etichetta siano inclusi. Chiedere al coordinatore per costi non chiari.`,offline:`Scarica itinerario offline (PDF)`,offlineNote:`Salva il PDF prima di perdere la connessione. Include programma e contatti degli alloggi; senza meteo in tempo reale. Versione: 24 settembre 2026.`,plan:`Apri il programma di oggi`,early:`Sveglia 05:00 · escursione nel deserto 08:00`,arrival:`Check-in dalle 14:00 · passeggiata 16:30`,flex:`Orario flessibile · concordare il transfer in aeroporto`,packed:`Pranzo al sacco: organizzarlo prima; pagamento separato.`,source:`Orari programmati · confermare le modifiche con il coordinatore.`},es:{title:`Namibia 2026 · Guía del viaje en grupo`,glance:`Hoy de un vistazo`,departure:`Salida / primer plan`,meeting:`Punto de encuentro`,pending:`Pendiente de confirmación del coordinador`,tonight:`Esta noche`,bring:`Qué llevar hoy`,reminders:`Recordatorios prácticos`,changes:`Cambios y confirmaciones del viaje`,changeNote:`Fuente: itinerario del coordinador del 18 de septiembre de 2026. Este aviso se actualiza manualmente al recibir cambios confirmados; no es una actualización en directo.`,changeText:`El día 4 es el único safari confirmado en jeep abierto (fondo común N$1.000). Cape Cross sigue siendo el plan base del día 6; Spitzkoppe es un Plan B opcional sin confirmar. Salida del día 8 a las 10:00. Visita al township del día 10 opcional: 15:00, 3 horas, N$750 extra.`,costs:`Costes de actividades`,cc:`Fondo común (CC)`,extra:`Extra opcional (FT)`,included:`Incluido en la excursión`,unknown:`Cobertura / precio por confirmar`,costNote:`Los importes CC salen del fondo común; no son pagos adicionales. No asumas que las actividades o comidas sin etiqueta están incluidas. Consulta los costes dudosos con el coordinador.`,offline:`Descargar itinerario sin conexión (PDF)`,offlineNote:`Guarda el PDF antes de perder cobertura. Incluye el programa y los contactos de alojamientos; sin tiempo en directo. Versión: 24 de septiembre de 2026.`,plan:`Abrir el plan de hoy`,early:`Inicio temprano 05:00 · excursión al desierto 08:00`,arrival:`Registro desde las 14:00 · paseo 16:30`,flex:`Horario flexible · acordar traslado al aeropuerto`,packed:`Almuerzo para llevar: organizar antes; pago aparte.`,source:`Horarios previstos · confirmar cambios con el coordinador.`}},bring:{en:[`Walking shoes, water, sun protection and an evening layer.`,`Trail shoes, water, sun hat and a warm layer for the sunset hike.`,`Closed shoes, sun hat, binoculars and a light evening layer.`,`Long pants, fleece/hoodie, windproof jacket, buff, water and charged camera.`,`Trail shoes, sun protection, headlamp and warm sleep clothes.`,`Windproof jacket, warm layer, closed shoes and laundry bag.`,`Secure shoes, fleece/hoodie, windproof jacket and a hat that stays on.`,`Coastal layers for the morning; light desert clothes and a two-night camp pouch.`,`Headlamp, trail shoes, plenty of water, sun hat, sunscreen and warm dawn layers.`,`Walking shoes, light daytime clothes and an evening layer.`,`Travel documents, medications, water and essentials in your small bag.`],it:[`Scarpe comode, acqua, protezione solare e uno strato per la sera.`,`Scarpe da trekking, acqua, cappello e uno strato caldo per il tramonto.`,`Scarpe chiuse, cappello, binocolo e uno strato leggero per la sera.`,`Pantaloni lunghi, pile/felpa, giacca antivento, scaldacollo, acqua e fotocamera carica.`,`Scarpe da trekking, protezione solare, frontale e vestiti caldi per dormire.`,`Giacca antivento, strato caldo, scarpe chiuse e sacco della biancheria.`,`Scarpe ben salde, pile/felpa, giacca antivento e cappello fissato bene.`,`Strati per la costa al mattino; vestiti leggeri e borsa per due notti in campeggio.`,`Frontale, scarpe da trekking, molta acqua, cappello, crema solare e strati caldi per l’alba.`,`Scarpe comode, vestiti leggeri e uno strato per la sera.`,`Documenti, farmaci, acqua ed essenziali nello zaino piccolo.`],es:[`Calzado cómodo, agua, protección solar y una capa para la noche.`,`Calzado de senderismo, agua, sombrero y una capa cálida para el atardecer.`,`Calzado cerrado, sombrero, prismáticos y una capa ligera para la noche.`,`Pantalón largo, polar/sudadera, cortavientos, braga de cuello, agua y cámara cargada.`,`Calzado de senderismo, protección solar, frontal y ropa cálida para dormir.`,`Cortavientos, capa cálida,
